services:
  pokesurvivor:
    build: .
    image: pokesurvivor-cn-nas:0.19.0
    restart: unless-stopped
    user: "${PUID:-99}:${PGID:-100}"
    ports:
      - "${HOST_PORT:-8766}:8080"
    volumes:
      - "${DATA_PATH:-./nas-data}:/data"
    environment:
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-}"
      TRUST_PROXY: "${TRUST_PROXY:-true}"
      REGISTRATION: "${REGISTRATION:-true}"
      CF_TURN_KEY_ID: "${CF_TURN_KEY_ID:-}"
      CF_TURN_KEY_API_TOKEN: "${CF_TURN_KEY_API_TOKEN:-}"
      CF_ACCOUNT_ID: "${CF_ACCOUNT_ID:-}"
      CF_ANALYTICS_TOKEN: "${CF_ANALYTICS_TOKEN:-}"
      CF_TURN_CAP_GB: "${CF_TURN_CAP_GB:-100}"
      CF_TURN_OTHER_USAGE_GB: "${CF_TURN_OTHER_USAGE_GB:-0}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
